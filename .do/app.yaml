# DigitalOcean App Platform Configuration
# https://docs.digitalocean.com/products/app-platform/

name: millenium-search-worker
region: fra

# Worker service (no HTTP server, just background process)
workers:
  - name: search-worker
    source_dir: /
    dockerfile_path: Dockerfile
    instance_count: 1
    instance_size_slug: basic-xxs  # $5/month - 512MB RAM, 0.5 vCPU

    # Environment variables
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        type: SECRET

      - key: MEILISEARCH_HOST
        scope: RUN_TIME
        value: http://meilisearch:7700  # If using same app, or use external URL

      - key: MEILISEARCH_MASTER_KEY
        scope: RUN_TIME
        type: SECRET

      - key: SYNC_INTERVAL_MINUTES
        scope: RUN_TIME
        value: "5"

    # Health check (optional - worker doesn't expose HTTP)
    # health_check:
    #   http_path: /health

